name: Terraform Provider Tests

on:
  pull_request:
    paths:
      - ".github/workflows/provider-tests.yaml"
      - "**.go"
      - "Makefile"
      - "scripts/**"
      - "tests/e2e/**"
      # .tf fixtures are not matched by "**.go"
      - "tests/migration/**"
      - "tests/resources/**"

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance Tests (Terraform ${{ matrix.terraform-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only test against one version for now as these tests are not
        # namespaced and will conflict
        terraform-version:
          - "1.13.*"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-go@cd53bc84d5e2fd85362f4cb840513e06427082d3 # v4
        with:
          go-version-file: "go.mod"
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: ${{ matrix.terraform-version }}
          terraform_wrapper: false
      - env:
          KONNECT_SPAT: ${{ secrets.KONNECT_SPAT }}
        run: make acceptance

  # Type-checks every acceptance fixture against the provider built from this
  # PR. The acceptance suite needs credentials and takes tens of minutes, so a
  # stale attribute in a testdata .tf otherwise surfaces deep inside that run -
  # or, on a fork PR where the credentialed jobs are skipped entirely, not at
  # all. Needs no secrets, so it is the only fixture check forks ever get.
  validate-testdata:
    name: Validate Test Fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-go@cd53bc84d5e2fd85362f4cb840513e06427082d3 # v4
        with:
          go-version-file: "go.mod"
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: "1.13.*"
          terraform_wrapper: false
      - run: make validate-testdata

  # Fast tier: drives every registered state upgrader in-process. No
  # credentials, so it also runs on forks.
  migration-unit:
    name: State Migration (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-go@cd53bc84d5e2fd85362f4cb840513e06427082d3 # v4
        with:
          go-version-file: "go.mod"
      - run: make migration-unit

  # Slow tier: real provider binaries, real state file, real plan. Runs after
  # the unit tier so an unwired upgrader fails cheaply first.
  migration-e2e:
    name: State Migration (main -> PR)
    runs-on: ubuntu-latest
    needs: migration-unit
    # Fork PRs cannot read secrets, so the job could only ever fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # The fixture names its control plane, and Konnect scopes names per org -
    # two runs at once would collide. Never cancel in progress: that would kill
    # the run before `terraform destroy` and leak real resources.
    concurrency:
      group: konnect-migration-e2e
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          # The baseline provider is built from a worktree of main, so the
          # shallow default checkout is not enough.
          fetch-depth: 0
      - uses: actions/setup-go@cd53bc84d5e2fd85362f4cb840513e06427082d3 # v4
        with:
          go-version-file: "go.mod"
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: "1.13.*"
          terraform_wrapper: false
      # Always measure the upgrade from main, not from the PR's base branch:
      # a stacked PR can target a branch that already carries `workspace`,
      # which would leave no migration to exercise.
      - name: Fetch main
        run: git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
      - env:
          KONNECT_SPAT: ${{ secrets.KONNECT_SPAT }}
        run: make migration-e2e BASELINE_REF=origin/main
